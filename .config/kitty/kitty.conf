font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

enable_audio_bell no

# Send macOS Option as Meta for tmux/Neovim shortcuts.
macos_option_as_alt yes

background_opacity 0.8
background_blur 40

# No confirmation window
confirm_os_window_close 0

# Disable the macOS shortcut for opening a new Kitty window.
map cmd+t no_op
map cmd+n no_op

# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
# include current-theme.conf
# END_KITTY_THEME
