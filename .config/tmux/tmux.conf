unbind C-b

set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set -sg escape-time 0

set-option -g status-style bg=default,fg=colour245

set-window-option -g mode-keys vi
bind 'v' copy-mode

# Move by words in the shell without letting tmux treat Alt+arrows as a pane command.
bind-key -n M-Left send-keys M-b
bind-key -n M-Right send-keys M-f

# Smart pane switching with Neovim awareness.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Keep Neovim's resize mappings reachable; resize ordinary tmux panes here.
bind-key -r -n M-C-Up if-shell "$is_vim" 'send-keys M-C-Up' 'resize-pane -U 4'
bind-key -r -n M-C-Down if-shell "$is_vim" 'send-keys M-C-Down' 'resize-pane -D 4'
bind-key -r -n M-C-Left if-shell "$is_vim" 'send-keys M-C-Left' 'resize-pane -L 4'
bind-key -r -n M-C-Right if-shell "$is_vim" 'send-keys M-C-Right' 'resize-pane -R 5'

bind-key -n M-m if-shell "$is_vim" 'send-keys M-m' 'select-pane -L'
bind-key -n M-n if-shell "$is_vim" 'send-keys M-n' 'select-pane -D'
bind-key -n M-e if-shell "$is_vim" 'send-keys M-e' 'select-pane -U'
bind-key -n M-i if-shell "$is_vim" 'send-keys M-i' 'select-pane -R'
